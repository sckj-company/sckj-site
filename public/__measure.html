<!doctype html>
<html>
<head><meta charset="utf-8"><title>measure</title></head>
<body>
<pre id="out">loading</pre>
<iframe id="f" style="width:1440px;height:900px;border:0"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const path = params.get('path') || '/';
  const frame = document.getElementById('f');
  frame.style.width = (params.get('w') || '1440') + 'px';
  frame.style.height = (params.get('h') || '900') + 'px';
  frame.onload = function () {
    const d = frame.contentDocument;
    const gallery = d.querySelector('.hero-gallery');
    const hero = gallery && gallery.closest('.hero1-section-area, .inner-page-hero-area');
    if (!gallery || !hero) {
      document.getElementById('out').textContent = JSON.stringify({ path: path, error: 'not found' });
      return;
    }
    const g = gallery.getBoundingClientRect();
    const h = hero.getBoundingClientRect();
    document.getElementById('out').textContent = JSON.stringify({
      path: path,
      gallery: { width: Math.round(g.width), height: Math.round(g.height), top: Math.round(g.top) },
      hero: { width: Math.round(h.width), height: Math.round(h.height) }
    });
  };
  frame.src = path;
</script>
</body>
</html>
