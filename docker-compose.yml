services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sckj_site_app
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      - mysql
    networks:
      - sckj_network

  nginx:
    image: nginx:alpine
    container_name: sckj_site_nginx
    restart: unless-stopped
    ports:
      - "8310:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sckj_network

  mysql:
    image: mysql:8.0
    container_name: sckj_site_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sckj-site-db
      MYSQL_ROOT_PASSWORD: Programador12
    volumes:
      - sckj_mysql_data:/var/lib/mysql
    networks:
      - sckj_network

networks:
  sckj_network:
    driver: bridge

volumes:
  sckj_mysql_data:
    